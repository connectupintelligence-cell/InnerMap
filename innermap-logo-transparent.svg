<svg viewBox="0 0 500 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wave-grad-trans" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66FCF1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#8A2BE2" />
    </linearGradient>
    <filter id="glow-trans" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Símbolo Onda Quântica -->
  <g transform="translate(10, 10)">
    <circle cx="50" cy="50" r="44" fill="none" stroke="url(#wave-grad-trans)" stroke-width="2.5" stroke-dasharray="12 6" opacity="0.4"/>
    <path d="M 22 50 C 35 25, 45 25, 50 50 C 55 75, 65 75, 78 50" fill="none" stroke="url(#wave-grad-trans)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow-trans)"/>
    <path d="M 25 50 C 38 68, 45 68, 50 50 C 55 32, 62 32, 75 50" fill="none" stroke="url(#wave-grad-trans)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <circle cx="50" cy="50" r="6" fill="url(#wave-grad-trans)"/>
    <circle cx="35" cy="37.5" r="3" fill="#66FCF1"/>
    <circle cx="65" cy="62.5" r="3" fill="#8A2BE2"/>
  </g>

  <!-- Tipografia InnerMap -->
  <text x="130" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Inner<tspan fill="url(#wave-grad-trans)">Map</tspan>
  </text>
  <text x="132" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#a855f7" letter-spacing="3" opacity="0.9">
    REORGANIZAÇÃO INFORMACIONAL
  </text>
</svg>
